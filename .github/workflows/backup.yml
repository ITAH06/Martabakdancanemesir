name: Backup Database Harian

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 09:00 WIB
  workflow_dispatch:

jobs:
  pgdump:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Buat dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          mkdir -p backups
          FILE="backups/database-$(date +%F).sql"
          pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" > "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Simpan artifact (retensi 30 hari)
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
